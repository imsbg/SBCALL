<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2P Secret Room Chat</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .chat-card { background: #1e293b; width: 100%; max-width: 480px; height: 600px; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155; }
    
    /* Header */
    .header { background: #0f172a; padding: 14px 18px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; color: #38bdf8; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #334155; color: #94a3b8; }
    .status-badge.online { background: #065f46; color: #34d399; }

    /* Join View */
    #joinSection { padding: 24px; display: flex; flex-direction: column; gap: 14px; justify-content: center; flex: 1; }
    .input-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    input[type="text"]:focus { outline: none; border-color: #38bdf8; }
    button.btn { padding: 12px; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button.btn:hover { background: #1d4ed8; }

    /* Chat View */
    #chatSection { display: none; flex-direction: column; flex: 1; height: calc(100% - 53px); }
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg-bubble.me { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .msg-bubble.peer { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
    .msg-bubble.system { align-self: center; background: transparent; color: #64748b; font-size: 0.75rem; }
    .sender-name { font-size: 0.7rem; color: #93c5fd; margin-bottom: 2px; font-weight: bold; }

    /* Input Footer */
    .input-bar { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    .input-bar input { flex: 1; padding: 10px 14px; }
    .input-bar button { padding: 10px 18px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="header">
      <h1 id="appTitle">P2P Secret Chat</h1>
      <span id="statusBadge" class="status-badge">Offline</span>
    </div>

    <!-- 1. Room Code / Nickname Screen -->
    <div id="joinSection">
      <div class="input-group">
        <label for="username">Your Nickname</label>
        <input type="text" id="username" placeholder="e.g. Alex" />
      </div>
      <div class="input-group">
        <label for="roomCode">Secret Code / Room ID</label>
        <input type="text" id="roomCode" placeholder="e.g. secret-xyz-99" />
      </div>
      <button class="btn" id="joinBtn">Enter Room</button>
    </div>

    <!-- 2. Chatting Interface -->
    <div id="chatSection">
      <div class="messages-container" id="messagesContainer"></div>
      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let myName = '';
    let secretCode = '';
    let isHost = false;

    const joinBtn = document.getElementById('joinBtn');
    const sendBtn = document.getElementById('sendBtn');
    const chatInput = document.getElementById('chatInput');
    const messagesContainer = document.getElementById('messagesContainer');
    const statusBadge = document.getElementById('statusBadge');
    const joinSection = document.getElementById('joinSection');
    const chatSection = document.getElementById('chatSection');

    function appendMessage(sender, text, type = 'peer') {
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${type}`;
      if (type === 'system') {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = `<div class="sender-name">${sender}</div>${escapeHtml(text)}`;
      }
      messagesContainer.appendChild(bubble);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function handleIncomingData(data, senderConn) {
      if (data.type === 'chat') {
        appendMessage(data.sender, data.text, 'peer');
        
        // If host, forward message to all other connected peers in the group
        if (isHost) {
          connections.forEach(conn => {
            if (conn !== senderConn && conn.open) {
              conn.send(data);
            }
          });
        }
      }
    }

    function setupConnectionEvents(conn) {
      conn.on('open', () => {
        if (!connections.includes(conn)) connections.push(conn);
        statusBadge.textContent = `${connections.length} Connected`;
        statusBadge.classList.add('online');
        appendMessage('', `${conn.metadata?.name || 'A user'} joined the chat`, 'system');
      });

      conn.on('data', (data) => handleIncomingData(data, conn));

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        statusBadge.textContent = connections.length > 0 ? `${connections.length} Connected` : 'Waiting...';
        appendMessage('', `${conn.metadata?.name || 'A user'} left`, 'system');
      });
    }

    joinBtn.onclick = () => {
      myName = document.getElementById('username').value.trim() || 'Anonymous';
      secretCode = document.getElementById('roomCode').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');

      if (!secretCode) {
        alert('Please enter a valid secret code.');
        return;
      }

      joinSection.style.display = 'none';
      chatSection.style.display = 'flex';
      document.getElementById('appTitle').textContent = `Room: ${secretCode}`;
      statusBadge.textContent = 'Connecting...';

      const hostPeerId = `room-${secretCode}-host`;

      // 1. Try to claim the room as Host
      peer = new Peer(hostPeerId);

      peer.on('open', () => {
        isHost = true;
        statusBadge.textContent = 'Waiting for peers...';
        appendMessage('', `Created secret room "${secretCode}". Share this code with your friends.`, 'system');

        // Listen for incoming peers
        peer.on('connection', (conn) => {
          setupConnectionEvents(conn);
        });
      });

      // 2. If the room is already hosted, join as a client peer
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer.destroy();
          // Generate a random client peer ID and connect to the host
          const clientPeer = new Peer();
          clientPeer.on('open', () => {
            const hostConn = clientPeer.connect(hostPeerId, {
              metadata: { name: myName }
            });
            setupConnectionEvents(hostConn);
          });
        } else {
          console.error(err);
        }
      });
    };

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const payload = { type: 'chat', sender: myName, text: text };
      
      // Broadcast to all open connections
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });

      appendMessage(myName, text, 'me');
      chatInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    chatInput.onkeydown = (e) => {
      if (e.key === 'Enter') sendMessage();
    };
  </script>
</body>
  </html>
